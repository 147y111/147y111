<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Movable-Type Music Visualization</title>
  <desc id="desc">Sixteen illuminated columns form a wave representing pitch, velocity, and timing from music data.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#171b35"/>
      <stop offset="1" stop-color="#30204a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#55c6bd"/>
      <stop offset="1" stop-color="#b289ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="28" fill="url(#bg2)"/>
  <text x="42" y="60" fill="#f1edff" font-family="Arial, sans-serif" font-size="30" font-weight="700">MOVABLE-TYPE MUSIC VISUALIZATION</text>
  <text x="42" y="92" fill="#a7dcd8" font-family="Arial, sans-serif" font-size="17">pitch · velocity · timing → a 16-column kinetic display</text>
  <g fill="url(#bar)" stroke="#d8ccff" stroke-width="2">
    <rect x="52" y="276" width="32" height="88" rx="6"/><rect x="96" y="246" width="32" height="118" rx="6"/>
    <rect x="140" y="204" width="32" height="160" rx="6"/><rect x="184" y="165" width="32" height="199" rx="6"/>
    <rect x="228" y="137" width="32" height="227" rx="6"/><rect x="272" y="121" width="32" height="243" rx="6"/>
    <rect x="316" y="146" width="32" height="218" rx="6"/><rect x="360" y="188" width="32" height="176" rx="6"/>
    <rect x="404" y="227" width="32" height="137" rx="6"/><rect x="448" y="247" width="32" height="117" rx="6"/>
    <rect x="492" y="216" width="32" height="148" rx="6"/><rect x="536" y="174" width="32" height="190" rx="6"/>
    <rect x="580" y="143" width="32" height="221" rx="6"/><rect x="624" y="157" width="32" height="207" rx="6"/>
    <rect x="668" y="198" width="32" height="166" rx="6"/><rect x="712" y="244" width="32" height="120" rx="6"/>
  </g>
  <path d="M52 275C145 272 175 125 285 122s122 130 207 94 127-106 252 28" fill="none" stroke="#ffd37d" stroke-width="5" stroke-linecap="round"/>
  <text x="50" y="398" fill="#ddd8f8" font-family="Arial, sans-serif" font-size="16">Audio converted to MIDI and CSV · motion mapping developed in Python</text>
</svg>
